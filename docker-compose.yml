services:
  db:
    image: postgres:16-alpine
    container_name: finora-db
    restart: unless-stopped
    environment:
      POSTGRES_DB: finora
      POSTGRES_USER: finora
      POSTGRES_PASSWORD: finora
    volumes:
      - db_data:/var/lib/postgresql/data
    ports:
      - "5432:5432"
    healthcheck:
      test: ["CMD-SHELL", "pg_isready -U finora -d finora"]
      interval: 5s
      timeout: 5s
      retries: 10

  redis:
    image: redis:7-alpine
    container_name: finora-redis
    restart: unless-stopped
    command: ["redis-server", "--appendonly", "yes"]
    volumes:
      - redis_data:/data
    ports:
      - "6379:6379"
    healthcheck:
      test: ["CMD", "redis-cli", "ping"]
      interval: 5s
      timeout: 3s
      retries: 10

  backend:
    build: ./backend
    container_name: finora-backend
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend:/var/www/html
    ports:
      - "8000:8000"
    depends_on:
      db:
        condition: service_healthy
      redis:
        condition: service_healthy
    command: >
      sh -c "php artisan migrate --force &&
             php -S 0.0.0.0:8000 -t public public/index.php"

  scheduler:
    build: ./backend
    container_name: finora-scheduler
    restart: unless-stopped
    user: "${UID:-1000}:${GID:-1000}"
    env_file:
      - ./backend/.env.docker
    volumes:
      - ./backend:/var/www/html
    depends_on:
      db:
        condition: service_healthy
    command: php artisan schedule:work

  frontend:
    build: ./frontend
    container_name: finora-frontend
    restart: unless-stopped
    volumes:
      - ./frontend:/app
      - /app/node_modules
    ports:
      - "5173:5173"
    environment:
      - VITE_API_URL=/api/v1
    depends_on:
      - backend

  nginx:
    image: nginx:alpine
    container_name: finora-nginx
    restart: unless-stopped
    volumes:
      - ./docker/nginx.conf:/etc/nginx/conf.d/default.conf:ro
    ports:
      - "9001:80"
    depends_on:
      - backend
      - frontend

volumes:
  db_data:
  redis_data:
